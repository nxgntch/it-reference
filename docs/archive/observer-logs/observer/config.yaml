# Task Observer Configuration
# Controls observation capture, thresholds, and review workflow

---

## Observation Capture

capture:
  enabled: true
  session_hook: true  # Capture at end of each Claude Code session

  # What to track
  track_corrections: true         # When user modifies AI output
  track_gaps: true                # Manual tasks that could be skills
  track_blind_spots: true         # Observer's own improvements
  track_cross_cutting: true       # Patterns spanning multiple skills

  # Minimum threshold for logging
  thresholds:
    correction_weight: 0.3        # How significant must correction be (0-1)
    gap_clarity: 0.5              # How clear must gap be (0-1)
    blind_spot_actionability: 0.7 # How actionable (0-1)

---

## Skills to Monitor

# Your nxgntch custom skills
monitored_skills:
  - agentCapabilityMapper
  - configSync
  - costAnalyzer
  - deploymentValidator
  - incidentRunner
  - phaseVerifier
  - preCommitAuditor
  - securityAudit

  # External skills used frequently
  - code-review
  - security-review
  - simplify
  - run
  - init

---

## Observation Levels

# Severity/priority of observations
priority_levels:
  critical:
    description: "Breaks workflow, security issue, data loss risk"
    review_sla: "Same day"
    auto_escalate: true

  high:
    description: "Frequently corrected, major gap, affects multiple skills"
    review_sla: "Within 3 days"
    auto_escalate: false

  medium:
    description: "Occasional corrections, minor improvements possible"
    review_sla: "Weekly review"
    auto_escalate: false

  low:
    description: "Nice-to-have improvements, rare patterns"
    review_sla: "Monthly review"
    auto_escalate: false

---

## Cross-Cutting Principles

# Project-wide patterns extracted from observations
# New skills are auto-validated against these

cross_cutting:
  enabled: true

  # Apply principles to new/updated skills
  validate_on_skill_change: true

  # Where principles are stored
  source: "approved/cross-cutting-principles.yaml"

  # How to handle violations
  on_violation:
    action: warn  # warn, block, or auto_fix
    notification: true
    escalate_critical: true

---

## Review Workflow

review:
  # Automatic review scheduling
  schedule:
    daily_scan: "09:00 UTC"       # Check for critical items
    weekly_batch: "Monday 09:00 UTC"  # Review all week's observations
    monthly_summary: "1st of month"   # Generate monthly report

  # Notification preferences
  notifications:
    email: true
    slack: false  # Set to your Slack channel if enabled
    cli: true      # Show in Claude Code output

  # Auto-archive settings
  auto_archive:
    enabled: true
    after_days: 30  # Archive unreviewed observations after 30 days
    criteria:
      - low_priority_only: true
      - no_supporting_context: true

---

## Skill Update Process

skill_updates:
  # How to apply approved changes
  apply_mode: manual  # manual, automatic, or hybrid

  # Validation before applying
  validate_before_apply:
    syntax_check: true
    cross_cutting_check: true
    existing_skill_check: true
    test_run: true

  # Backup strategy
  backup:
    enabled: true
    before_each_update: true
    retention_days: 90

---

## Integration

integration:
  # Claude Code session capture
  claude_code_session:
    enabled: true
    capture_script: "capture_session.py"

  # Git integration
  git:
    enabled: true
    tag_observations: true  # Add observation IDs to related commits
    reference_issues: true  # Link to GitHub issues when applicable

  # Documentation
  documentation:
    enabled: true
    update_CLAUDE_md: true
    update_skill_docs: true
    cross_reference: true

---

## Output & Logging

logging:
  # Observation log
  observations:
    format: jsonl  # JSON Lines (one JSON object per line)
    path: "logs/observations.jsonl"
    rotation: monthly
    retention_days: 365

  # Approved changes
  approved:
    format: yaml
    path: "approved/"
    version_control: true

  # Archive old observations
  archive:
    enabled: true
    path: "logs/monthly/"
    compress: true

---

## Blind Spot Tracking

blind_spots:
  # What the observer tracks about itself
  enabled: true

  track:
    missed_corrections: true   # Corrections observer didn't catch
    false_positives: true      # Observations user disagreed with
    methodology_gaps: true     # Patterns observer can't detect
    performance_issues: true   # Slow observation captures

  # Improve observer based on blind spot feedback
  auto_improve: true
  feedback_source: "approved/blind_spot_improvements.yaml"

---

## Reporting

reporting:
  # Generate periodic reports
  reports:
    daily: true    # Quick critical summary
    weekly: true   # Full week summary with trends
    monthly: true  # Comprehensive monthly report

  # What to include
  include:
    observation_count: true
    skills_affected: true
    gaps_identified: true
    correction_patterns: true
    blind_spot_improvements: true
    recommendations: true
    trends: true

  # Where to publish
  publish:
    location: "observer/reports/"
    formats: [html, markdown, json]

---

## Experimental Features

experimental:
  # Auto-generate skill improvements
  auto_skill_generation: false

  # Use ML to detect patterns
  pattern_detection_ml: false

  # Predict future gaps
  predictive_gaps: false

---

## Notes

- This config applies to `.claude/observer/` capture system
- Observer recommendations don't auto-apply—you control all changes
- Observations are append-only (never modified retroactively)
- Cross-cutting principles evolve as you approve changes
- Critical observations trigger same-day review (if auto_escalate=true)

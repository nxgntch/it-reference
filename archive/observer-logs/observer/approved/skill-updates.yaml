# Approved Skill Updates

Improvements to existing skills based on observations and review.

Format: Each entry is an approved change waiting to be applied.

---

## Template

```yaml
- observation_id: "obs_2026-08-22_001"
  status: "approved"  # approved, applied, or rejected
  skill: "skill-name"

  # What needs to change
  change:
    description: "Add CORS validation to security checks"
    affected_sections: ["cors_validation", "api_security"]
    estimated_effort: "30 minutes"

  # How to implement
  implementation:
    approach: "Add regex pattern detection for allow_origins=['*']"
    success_criteria: "Skill flags CORS wildcards and suggests explicit list"
    test_scenarios:
      - input: "allow_origins=['*']"
        expected: "CORS misconfiguration detected"

  # Application tracking
  applied_date: null
  applied_by: null
  applied_in_commit: null
  notes: ""
```


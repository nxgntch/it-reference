## How to Use

### Adding an Approved Change

1. Copy the Template above
2. Fill in details from observation
3. Add to this file
4. Commit with message: `chore(observer): approve skill update for {skill_name}`

### Applying an Approved Change

1. Review change in this file
2. Make the update to the skill
3. Test that it works
4. Update this file:
   - Set `status: "applied"`
   - Set `applied_date: "2026-08-22"`
   - Set `applied_by: "christian.salvador210@gmail.com"`
   - Set `applied_in_commit: "abc123def456..."`
5. Commit with message: `feat({skill}): {description} (obs_{id})`

### Rejecting a Change

1. Review change in this file
2. Decide not to apply
3. Update this file:
   - Set `status: "rejected"`
   - Add notes explaining why
4. Move to "Rejected Changes" section for historical reference

---

## Integration

- Updates here feed into the main skill files in `../.claude/skills/`
- Applied changes update `observations.jsonl` with completion status
- Monthly reports track implementation velocity

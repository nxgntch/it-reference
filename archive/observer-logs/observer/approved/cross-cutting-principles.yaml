## Examples

### Applying Security-1 Principle

When security-review skill is updated to check CORS:
```python
# Validator checks this skill against Security-1
principle = load_principle("Security-1")

# Check: Does skill handle CORS?
if skill.includes_section("cors"):
    # Check: Does it flag allow_origins=['*']?
    if principle.validate(skill.cors_section):
        logger.info("✓ Skill compliant with Security-1")
    else:
        raise PrincipleViolationError(
            f"CORS section doesn't enforce allowlist: {principle.details}"
        )
```


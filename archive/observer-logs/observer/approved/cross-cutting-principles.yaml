## Validation Automation

When a skill is created/updated:
```python
def validateSkillAgainstPrinciples(skill):
    """Check skill against all active cross-cutting principles."""
    violations = []

    for principle in load_active_principles():
        if principle.applies_to(skill):
            if not principle.validate(skill):
                violations.append({
                    "principle": principle.id,
                    "severity": principle.severity,
                    "message": principle.check_failed_message
                })

    if violations:
        if any(v["severity"] == "critical" for v in violations):
            raise PrincipleViolationError(violations)
        else:
            logger.warning(f"Principle warnings: {violations}")

    return True
```

